[colors]
background = #1E1E2E
foreground = #CDD6F4
pink = #F5C2E7
blue = #89B4FA
lavender = #B4BEFE
peach = #FAB387
green = #A6E3A1

[bar/main]
width = 100%
height = 28pt
background = ${colors.background}
foreground = ${colors.foreground}
border-bottom-size = 3pt
border-bottom-color = ${colors.pink}

padding-left = 1
padding-right = 1
module-margin = 1

font-0 = GohuFont 14 Nerd Font:size=16;2

modules-left = xworkspaces
modules-center = date
modules-right = battery pulseaudio memory systray

[module/systray]
type = internal/tray
tray-spacing = 8pt

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.lavender}
label-active-foreground = ${colors.background}
label-active-padding = 2
label-occupied = %name%
label-occupied-padding = 2
label-empty = %name%
label-empty-foreground = #6C7086
label-empty-padding = 2

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.pink}

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = BAT0
adapter = ADP1
format-charging = <label-charging>
format-discharging = <label-discharging>
label-charging = 󰂄 %percentage%%
label-discharging = 󰂂 %percentage%%
label-charging-foreground = ${colors.green}
label-discharging-foreground = ${colors.peach}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = 󰕾 %percentage%%
label-volume-foreground = ${colors.blue}
label-muted = 
label-muted-foreground = #6C7086

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.lavender}
label = %percentage_used:2%%
