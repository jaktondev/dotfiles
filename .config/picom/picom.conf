# Shadows
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.5;
shadow-offset-x = -12;
shadow-offset-y = -12;

# Exclude specific windows from shadows if needed (e.g., hidden i3 frames)
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Transparency / Opacity
opacity-rule = [
  "85:class_g = 'kitty' && focused",
  "80:class_g = 'kitty' && !focused"
];

# General Settings
backend = "glx";
vsync = true;
use-damage = true;
